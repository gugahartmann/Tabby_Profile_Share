# Tabby Profile Share — screenshot-only sample configuration.
# Based on Tabby's real config.yaml keys: version, showProfileTree, groups and profiles.
# All addresses are reserved for documentation or under the non-resolving .invalid TLD.
# NEVER use this file to replace a production config.yaml: copy a backup first,
# then merge ONLY groups/profiles into a disposable Tabby instance.
# No passwords, private keys, private key paths, scripts or real infrastructure.
version: 1
showProfileTree: true

groups:
  - id: demo-lab
    name: "00 · Demo Network"
    icon: "fas fa-network-wired"
  - id: demo-north
    name: "North Region"
