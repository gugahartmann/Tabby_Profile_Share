name: Test and package Profile Share
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm test

  build:
    name: Build and package plugin
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install build dependencies
        run: npm install --legacy-peer-deps
      - name: Compile TypeScript / Webpack
        run: npm run build
      - name: Package installable artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package-out/tabby-profile-share
          npm pack --pack-destination package-out
          cp -R dist package.json README.md package-out/tabby-profile-share/
          VERSION=$(node -p "require('./package.json').version")
          (cd package-out && zip -q -r "tabby-profile-share-plugin-${VERSION}.zip" tabby-profile-share)
          test -s "package-out/tabby-profile-share-${VERSION}.tgz"
          test -s "package-out/tabby-profile-share-plugin-${VERSION}.zip"
          node -e "const p=require('./package-out/tabby-profile-share/package.json'); if (!p.author?.name || !p.keywords.includes('tabby-plugin')) process.exit(1)"
      - name: Upload compiled plugin
        uses: actions/upload-artifact@v4
        with:
          name: Tabby-Profile-Share-compiled-preview
          path: |
            package-out/*.tgz
            package-out/*.zip
          if-no-files-found: error
          retention-days: 30
